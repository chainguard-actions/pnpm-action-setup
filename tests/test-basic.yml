name: Test basic pnpm setup with specific version
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          version: 9.0.0
      - name: Assert pnpm is installed
        run: |
          echo "Checking pnpm is available..."
          which pnpm
          PNPM_VERSION=$(pnpm --version)
          echo "pnpm version: $PNPM_VERSION"
          if [ -z "$PNPM_VERSION" ]; then
            echo "FAIL: pnpm version is empty"
            exit 1
          fi
          echo "PASS: pnpm is installed with version $PNPM_VERSION"
      - name: Assert pnpm version matches requested
        run: |
          PNPM_VERSION=$(pnpm --version)
          echo "actual version: $PNPM_VERSION"
          if [ "$PNPM_VERSION" != "9.0.0" ]; then
            echo "FAIL: expected version 9.0.0 but got $PNPM_VERSION"
            exit 1
          fi
          echo "PASS: pnpm version is 9.0.0"

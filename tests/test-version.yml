name: Test pnpm setup with specific version
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          version: '9.0.0'
      - name: Assert pnpm is installed
        run: |
          echo "Checking pnpm is available..."
          which pnpm || (echo "FAIL: pnpm not found in PATH" && exit 1)
          PNPM_VERSION=$(pnpm --version)
          echo "pnpm version: $PNPM_VERSION"
          echo "PASS: pnpm is installed"
      - name: Assert pnpm version matches requested
        run: |
          PNPM_VERSION=$(pnpm --version)
          echo "actual version: $PNPM_VERSION"
          if [ "$PNPM_VERSION" != "9.0.0" ]; then
            echo "FAIL: expected pnpm version 9.0.0, got $PNPM_VERSION"
            exit 1
          fi
          echo "PASS: pnpm version is 9.0.0"
      - name: Assert dest output is set
        env:
          DEST: ${{ steps.action.outputs.dest }}
        run: |
          echo "dest: $DEST"
          if [ -z "$DEST" ]; then
            echo "FAIL: dest output is empty"
            exit 1
          fi
          echo "PASS: dest output is set to $DEST"
      - name: Assert bin_dest output is set
        env:
          BIN_DEST: ${{ steps.action.outputs.bin_dest }}
        run: |
          echo "bin_dest: $BIN_DEST"
          if [ -z "$BIN_DEST" ]; then
            echo "FAIL: bin_dest output is empty"
            exit 1
          fi
          echo "PASS: bin_dest output is set to $BIN_DEST"

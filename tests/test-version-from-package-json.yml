name: Test pnpm version from package.json packageManager field
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Ensure npm v7+ is available
        run: |
          echo "npm version: $(npm --version 2>/dev/null || echo 'not found')"
          npm install -g npm@latest 2>/dev/null || sudo npm install -g npm@latest 2>/dev/null || true
          echo "npm version after update: $(npm --version 2>/dev/null || echo 'not found')"

      # The fixture package.json at tests/fixtures/pkg/package.json contains:
      # { "packageManager": "pnpm@12.3.4" }
      - id: action
        uses: .
        with:
          package_json_file: tests/fixtures/pkg/package.json

      - name: Assert pnpm is installed with version from packageManager field
        run: |
          echo "Checking pnpm is on PATH..."
          which pnpm || { echo "FAIL: pnpm not found on PATH"; exit 1; }
          INSTALLED_VERSION=$(pnpm --version)
          echo "Installed pnpm version: $INSTALLED_VERSION"
          if [ "$INSTALLED_VERSION" != "12.3.4" ]; then
            echo "FAIL: expected version 12.3.4 from packageManager field, got $INSTALLED_VERSION"
            exit 1
          fi
          echo "PASS: pnpm $INSTALLED_VERSION installed from packageManager field"

      - name: Assert dest output is set
        env:
          DEST: ${{ steps.action.outputs.dest }}
        run: |
          echo "dest: $DEST"
          if [ -z "$DEST" ]; then
            echo "FAIL: dest output is empty"
            exit 1
          fi
          echo "PASS: dest output is '$DEST'"

      - name: Assert bin_dest output is set
        env:
          BIN_DEST: ${{ steps.action.outputs.bin_dest }}
        run: |
          echo "bin_dest: $BIN_DEST"
          if [ -z "$BIN_DEST" ]; then
            echo "FAIL: bin_dest output is empty"
            exit 1
          fi
          echo "PASS: bin_dest output is '$BIN_DEST'"

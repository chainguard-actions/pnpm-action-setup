name: Test pnpm setup in standalone mode
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        with:
          version: 9.15.4
          standalone: 'true'

      - name: Assert dest output is set
        env:
          DEST: ${{ steps.action.outputs.dest }}
        run: |
          echo "dest: $DEST"
          if [ -z "$DEST" ]; then
            echo "FAIL: dest output is empty"
            exit 1
          fi
          echo "PASS: dest=$DEST"

      - name: Assert bin_dest output is set
        env:
          BIN_DEST: ${{ steps.action.outputs.bin_dest }}
        run: |
          echo "bin_dest: $BIN_DEST"
          if [ -z "$BIN_DEST" ]; then
            echo "FAIL: bin_dest output is empty"
            exit 1
          fi
          echo "PASS: bin_dest=$BIN_DEST"

      - name: Assert pnpm is on PATH and correct version
        run: |
          which pnpm
          INSTALLED_VERSION="$(pnpm --version)"
          echo "installed pnpm version: $INSTALLED_VERSION"
          if [ "$INSTALLED_VERSION" != "9.15.4" ]; then
            echo "FAIL: expected version 9.15.4, got $INSTALLED_VERSION"
            exit 1
          fi
          echo "PASS"

      - name: Assert standalone binary exists in bin_dest
        env:
          BIN_DEST: ${{ steps.action.outputs.bin_dest }}
        run: |
          echo "bin_dest: $BIN_DEST"
          if [ ! -f "$BIN_DEST/pnpm" ]; then
            echo "FAIL: pnpm binary not found at $BIN_DEST/pnpm"
            exit 1
          fi
          echo "PASS: pnpm binary found at $BIN_DEST/pnpm"

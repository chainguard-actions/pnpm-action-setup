name: Test pnpm setup in standalone mode
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        with:
          version: '9.0.0'
          standalone: 'true'

      - name: Assert dest output is set
        env:
          DEST: ${{ steps.action.outputs.dest }}
        run: |
          echo "dest: $DEST"
          if [ -z "$DEST" ]; then
            echo "FAIL: expected dest output to be set"
            exit 1
          fi
          echo "PASS: dest=$DEST"

      - name: Assert bin_dest output is set
        env:
          BIN_DEST: ${{ steps.action.outputs.bin_dest }}
        run: |
          echo "bin_dest: $BIN_DEST"
          if [ -z "$BIN_DEST" ]; then
            echo "FAIL: expected bin_dest output to be set"
            exit 1
          fi
          echo "PASS: bin_dest=$BIN_DEST"

      - name: Assert pnpm is available in standalone mode
        run: |
          echo "pnpm version: $(pnpm --version)"
          ACTUAL_VERSION="$(pnpm --version)"
          if [ "$ACTUAL_VERSION" != "9.0.0" ]; then
            echo "FAIL: expected pnpm version 9.0.0 but got $ACTUAL_VERSION"
            exit 1
          fi
          echo "PASS: pnpm standalone version is 9.0.0"

name: Test version from packageManager field
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          package_json_file: tests/fixtures/pkgmgr/package.json
      - name: Assert pnpm version matches packageManager
        env:
          BIN_DEST: ${{ steps.action.outputs.bin_dest }}
        run: |
          echo "bin_dest: $BIN_DEST"
          V="$("$BIN_DEST/pnpm" --version)"
          echo "version: $V"
          if [ "$V" != "9.12.0" ]; then
            echo "FAIL: expected 9.12.0"
            exit 1
          fi
          echo "PASS"

name: Test run_install
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          version: 9.15.0
          run_install: |
            cwd: ${{ github.workspace }}/tests/fixtures/install-project
      - name: Assert install ran
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "success" ]; then
            echo "FAIL: expected success"
            exit 1
          fi
          ls -la "$GITHUB_WORKSPACE/tests/fixtures/install-project"
          V="$(pnpm --version)"
          echo "version: $V"
          if [ "$V" != "9.15.0" ]; then
            echo "FAIL: expected 9.15.0"
            exit 1
          fi
          echo "PASS"

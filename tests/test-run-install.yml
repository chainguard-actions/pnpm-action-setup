name: Test pnpm setup with run_install
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Create a minimal package.json for install
        run: |
          mkdir -p "$GITHUB_WORKSPACE/tests/fixtures/install-test"
          cat > "$GITHUB_WORKSPACE/tests/fixtures/install-test/package.json" <<'EOF'
          {
            "name": "install-test",
            "version": "1.0.0",
            "dependencies": {}
          }
          EOF
      - id: action
        uses: .
        with:
          version: 8.15.4
          run_install: |
            - recursive: true
              args: [--frozen-lockfile, --strict-peer-dependencies]
            - args: [--global, gulp]
        continue-on-error: true
      - name: Assert pnpm is installed regardless of run_install outcome
        run: |
          echo "Checking pnpm is available..."
          if ! which pnpm; then
            echo "FAIL: pnpm not found on PATH"
            exit 1
          fi
          INSTALLED="$(pnpm --version)"
          echo "installed version: $INSTALLED"
          if [ "$INSTALLED" != "8.15.4" ]; then
            echo "FAIL: expected version 8.15.4 but got $INSTALLED"
            exit 1
          fi
          echo "PASS: pnpm is installed correctly"

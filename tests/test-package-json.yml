name: Test pnpm setup from package.json packageManager field
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Create package.json with packageManager field
        run: |
          cat > "$GITHUB_WORKSPACE/package.json" <<'EOF'
          {
            "name": "test-project",
            "version": "1.0.0",
            "packageManager": "pnpm@8.15.0"
          }
          EOF
          echo "Created package.json:"
          cat "$GITHUB_WORKSPACE/package.json"
      - id: action
        uses: .
        with:
          package_json_file: package.json
      - name: Assert pnpm is installed
        run: |
          echo "Checking pnpm is available..."
          which pnpm
          PNPM_VERSION=$(pnpm --version)
          echo "pnpm version: $PNPM_VERSION"
          if [ -z "$PNPM_VERSION" ]; then
            echo "FAIL: pnpm version is empty"
            exit 1
          fi
          echo "PASS: pnpm is installed with version $PNPM_VERSION"
      - name: Assert pnpm version matches packageManager field
        run: |
          PNPM_VERSION=$(pnpm --version)
          echo "actual version: $PNPM_VERSION"
          if [ "$PNPM_VERSION" != "8.15.0" ]; then
            echo "FAIL: expected version 8.15.0 but got $PNPM_VERSION"
            exit 1
          fi
          echo "PASS: pnpm version matches packageManager field"

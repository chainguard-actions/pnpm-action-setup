name: Test pnpm version selection
on:
  workflow_dispatch:
jobs:
  test-v12:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Ensure npm v7+ is available
        run: |
          echo "npm version: $(npm --version 2>/dev/null || echo 'not found')"
          npm install -g npm@latest 2>/dev/null || sudo npm install -g npm@latest 2>/dev/null || true
          echo "npm version after update: $(npm --version 2>/dev/null || echo 'not found')"

      - id: action
        uses: .
        with:
          version: 12.3.4

      - name: Assert pnpm v12 is installed
        run: |
          which pnpm || { echo "FAIL: pnpm not found on PATH"; exit 1; }
          INSTALLED_VERSION=$(pnpm --version)
          echo "Installed pnpm version: $INSTALLED_VERSION"
          if [ "$INSTALLED_VERSION" != "12.3.4" ]; then
            echo "FAIL: expected version 12.3.4, got $INSTALLED_VERSION"
            exit 1
          fi
          echo "PASS: pnpm $INSTALLED_VERSION installed correctly"

      - name: Assert dest output is set
        env:
          DEST: ${{ steps.action.outputs.dest }}
        run: |
          echo "dest: $DEST"
          if [ -z "$DEST" ]; then
            echo "FAIL: dest output is empty"
            exit 1
          fi
          echo "PASS: dest output is '$DEST'"

      - name: Assert bin_dest output is set
        env:
          BIN_DEST: ${{ steps.action.outputs.bin_dest }}
        run: |
          echo "bin_dest: $BIN_DEST"
          if [ -z "$BIN_DEST" ]; then
            echo "FAIL: bin_dest output is empty"
            exit 1
          fi
          echo "PASS: bin_dest output is '$BIN_DEST'"

      - name: Assert pnpm binary is in bin_dest
        env:
          BIN_DEST: ${{ steps.action.outputs.bin_dest }}
        run: |
          echo "Checking pnpm binary in bin_dest: $BIN_DEST"
          if [ ! -f "$BIN_DEST/pnpm" ]; then
            echo "FAIL: pnpm binary not found in bin_dest '$BIN_DEST'"
            exit 1
          fi
          echo "PASS: pnpm binary found in bin_dest"

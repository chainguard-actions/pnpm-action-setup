name: Test pnpm setup from packageManager field in package.json
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create a package.json with packageManager field
        run: |
          mkdir -p "$GITHUB_WORKSPACE/tests/fixtures/pkg"
          cat > "$GITHUB_WORKSPACE/tests/fixtures/pkg/package.json" <<'EOF'
          {
            "name": "test-project",
            "packageManager": "pnpm@9.12.3"
          }
          EOF

      - id: action
        uses: .
        with:
          package_json_file: tests/fixtures/pkg/package.json

      - name: Assert dest output is set
        env:
          DEST: ${{ steps.action.outputs.dest }}
        run: |
          echo "dest: $DEST"
          if [ -z "$DEST" ]; then
            echo "FAIL: dest output is empty"
            exit 1
          fi
          echo "PASS: dest=$DEST"

      - name: Assert bin_dest output is set
        env:
          BIN_DEST: ${{ steps.action.outputs.bin_dest }}
        run: |
          echo "bin_dest: $BIN_DEST"
          if [ -z "$BIN_DEST" ]; then
            echo "FAIL: bin_dest output is empty"
            exit 1
          fi
          echo "PASS: bin_dest=$BIN_DEST"

      - name: Assert pnpm is on PATH and correct version
        run: |
          which pnpm
          INSTALLED_VERSION="$(pnpm --version)"
          echo "installed pnpm version: $INSTALLED_VERSION"
          if [ "$INSTALLED_VERSION" != "9.12.3" ]; then
            echo "FAIL: expected version 9.12.3, got $INSTALLED_VERSION"
            exit 1
          fi
          echo "PASS"

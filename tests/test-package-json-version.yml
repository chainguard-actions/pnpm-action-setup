name: Test pnpm setup with version from package.json
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          package_json_file: tests/fixtures/pkg/package.json
      - name: Assert dest output is set
        env:
          DEST: ${{ steps.action.outputs.dest }}
        run: |
          echo "dest: $DEST"
          if [ -z "$DEST" ]; then
            echo "FAIL: dest output is empty"
            exit 1
          fi
          echo "PASS: dest=$DEST"
      - name: Assert pnpm is installed and correct version
        run: |
          echo "pnpm version: $(pnpm --version)"
          INSTALLED=$(pnpm --version)
          if [ "$INSTALLED" != "9.1.0" ]; then
            echo "FAIL: expected pnpm 9.1.0 but got $INSTALLED"
            exit 1
          fi
          echo "PASS"

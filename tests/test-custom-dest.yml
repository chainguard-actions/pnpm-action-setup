name: Test pnpm setup with custom destination
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        with:
          version: '9.0.0'
          dest: '~/my-custom-pnpm-dest'

      - name: Assert dest output matches custom path
        env:
          DEST: ${{ steps.action.outputs.dest }}
        run: |
          echo "dest: $DEST"
          if [ -z "$DEST" ]; then
            echo "FAIL: expected dest output to be non-empty"
            exit 1
          fi
          # The dest should expand ~ to the home directory
          EXPECTED="$HOME/my-custom-pnpm-dest"
          if [ "$DEST" != "$EXPECTED" ]; then
            echo "FAIL: expected dest '$EXPECTED' but got '$DEST'"
            exit 1
          fi
          echo "PASS: dest=$DEST"

      - name: Assert custom dest directory exists
        env:
          DEST: ${{ steps.action.outputs.dest }}
        run: |
          echo "Checking if $DEST exists"
          if [ ! -d "$DEST" ]; then
            echo "FAIL: custom dest directory $DEST does not exist"
            exit 1
          fi
          echo "PASS: custom dest directory exists"

      - name: Assert pnpm is installed and accessible
        run: |
          echo "pnpm version: $(pnpm --version)"
          PNPM_VERSION="$(pnpm --version)"
          if [ -z "$PNPM_VERSION" ]; then
            echo "FAIL: pnpm not installed"
            exit 1
          fi
          echo "PASS: pnpm is installed, version=$PNPM_VERSION"

      - name: Assert bin_dest is under custom dest
        env:
          DEST: ${{ steps.action.outputs.dest }}
          BIN_DEST: ${{ steps.action.outputs.bin_dest }}
        run: |
          echo "dest: $DEST"
          echo "bin_dest: $BIN_DEST"
          if [ -z "$BIN_DEST" ]; then
            echo "FAIL: bin_dest output is empty"
            exit 1
          fi
          # bin_dest should be under the custom dest
          case "$BIN_DEST" in
            "$DEST"*)
              echo "PASS: bin_dest is under custom dest"
              ;;
            *)
              echo "FAIL: bin_dest '$BIN_DEST' is not under dest '$DEST'"
              exit 1
              ;;
          esac
